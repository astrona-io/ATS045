    path: sections/section-020/capstone/labs/lab-01
    difficulty: advanced
    estimated_duration: 30m
    topic: image-repository
    task_kind: build
    tags: [registry, credential-rotation, image-digest, imagepullpolicy]
    learning_goals:
      - "Replace a revoked pull credential in two namespaces"
      - "Pin images to the digest the registry reports"
      - "Set imagePullPolicy Always and keep workloads available"
    resources:
      - name: "Images"
        url: https://kubernetes.io/docs/concepts/containers/images/
      - name: "Pull an Image from a Private Registry"
        url: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  - type: quiz
    title: "Knowledge Check: Image Repository"
    path: sections/section-020/quiz.yaml
    pass_score: 70
- id: module-030
  title: "Observability"
  description: "Record and read security evidence: audit policy levels and rule order, enabling audit logging on the API server, reading events, and the limits of collection, retention and different evidence sources."
  status: alpha
