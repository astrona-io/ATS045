training:
  id: ATS045
  title: 'KCSA: Platform Security'
  description: Concept lessons, diagrams and original scenario assessments covering every published objective
    in this KCSA domain.
  certification:
    name: Kubernetes and Cloud Native Security Associate
    code: KCSA
    provider: CNCF / Linux Foundation
    domain: Platform Security
    weight: 16
    competencies:
    - Supply Chain Security
    - Image Repository
    - Observability
    - Service Mesh
    - PKI
    - Connectivity
    - Admission Control
modules:
- id: module-intro
  title: Introduction
  description: Audience, learning approach, reading requirements and contribution process.
  content:
  - type: reading
    title: Introduction
    path: sections/intro/README.md
  - type: reading
    title: Welcome To The Course
    path: sections/intro/course-01-welcome.md
  - type: reading
    title: Get Your Machine Ready
    path: sections/intro/course-02-get-your-machine-ready.md
  - type: reading
    title: How This Course Is Made
    path: sections/intro/course-03-how-this-course-is-made.md
- id: module-010
  title: "Supply Chain Security"
  description: "Trace trust from source to running container: digests, signatures, provenance, SBOMs and scans, pinning images, and protecting credentials in the runtime."
  status: alpha
  content:
  - type: reading
    title: "Supply Chain Security: Introduction"
    path: sections/section-010/README.md
  - type: reading
    title: "Trust What You Deploy"
    path: sections/section-010/module-01/course.md
  - type: reading
    title: "Artifact Evidence And Sensitive Build Inputs"
    path: sections/section-010/module-01/course-01-artifact-evidence-and-sensitive-build-inputs.md
  - type: reading
    title: "Connecting Verification To Execution Policy"
    path: sections/section-010/module-01/course-02-connecting-verification-to-execution-policy.md
  - type: reading
    title: "Credentials And Service Account Tokens"
    path: sections/section-010/module-01/course-03-credentials-and-service-account-tokens.md
  - type: reading
    title: Question
    path: sections/section-010/module-01/labs/lab-01/question.md
  - type: lab
    title: "Pin Images By Digest And Mount Credentials As Files"
    path: sections/section-010/module-01/labs/lab-01
    difficulty: intermediate
    estimated_duration: 20m
    topic: supply-chain
    task_kind: build
    tags: [image-digest, secret-volume, serviceaccount-token, least-privilege]
    learning_goals:
      - "Pin two Deployments to the digest of the image that runs"
      - "Move a password from an environment variable to a Secret mounted as a read-only file"
      - "Stop a pod from receiving a ServiceAccount token"
    resources:
      - name: "Images"
        url: https://kubernetes.io/docs/concepts/containers/images/
      - name: "Secrets"
        url: https://kubernetes.io/docs/concepts/configuration/secret/
  - type: reading
    title: Summary
    path: sections/section-010/module-01/course-04-summary.md
  - type: reading
    title: Question
    path: sections/section-010/capstone/labs/lab-01/question.md
  - type: lab
    title: "Harden A Build Runner Workload"
    path: sections/section-010/capstone/labs/lab-01
    difficulty: advanced
    estimated_duration: 30m
    topic: supply-chain
    task_kind: build
    tags: [image-digest, secret, serviceaccount, rolebinding, security-context]
    learning_goals:
      - "Give a workload its own ServiceAccount without a token and remove a broad RoleBinding"
      - "Pin the image by digest and replace an environment token with a mounted Secret"
      - "Apply a hardened container security context and keep the workload available"
    resources:
      - name: "Configure Service Accounts for Pods"
        url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
      - name: "Security context"
        url: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  - type: quiz
    title: "Knowledge Check: Supply Chain Security"
    path: sections/section-010/quiz.yaml
    pass_score: 70
- id: module-020
  title: "Image Repository"
  description: "Secure access to an image repository: how registries store images, what authentication does and does not cover, pull Secrets, ServiceAccounts, pull policy and credential rotation."
  status: alpha
  content:
  - type: reading
    title: "Image Repository: Introduction"
    path: sections/section-020/README.md
