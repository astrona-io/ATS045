    task_kind: configure
    tags: [audit, kube-apiserver, audit-policy, jq]
    learning_goals:
      - "Enable audit logging on the API server"
      - "Write a policy with Secrets at Metadata and Deployments at RequestResponse"
      - "Find the caller of a deletion in the audit log"
    resources:
      - name: "Auditing"
        url: https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
  - type: reading
    title: Summary
    path: sections/section-030/module-01/course-04-summary.md
  - type: reading
    title: Question
    path: sections/section-030/capstone/labs/lab-01/question.md
