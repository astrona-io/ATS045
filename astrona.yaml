  - type: reading
    title: "Protecting Publishers, Readers And Repository State"
    path: sections/section-020/module-01/course-02-protecting-publishers-readers-and-repository-state.md
  - type: reading
    title: "Pull Secrets And Pull Policy"
    path: sections/section-020/module-01/course-03-pull-secrets-and-pull-policy.md
  - type: reading
    title: Question
    path: sections/section-020/module-01/labs/lab-01/question.md
  - type: lab
    title: "Fix ImagePullBackOff With A Pull Secret"
    path: sections/section-020/module-01/labs/lab-01
    difficulty: intermediate
    estimated_duration: 20m
    topic: image-repository
    task_kind: build
    tags: [registry, imagepullsecrets, serviceaccount]
    learning_goals:
      - "Create a docker-registry Secret for a private registry"
      - "Attach it to ServiceAccounts so pods can pull"
      - "Keep the registry private"
    resources:
      - name: "Pull an Image from a Private Registry"
        url: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
      - name: "Images"
        url: https://kubernetes.io/docs/concepts/containers/images/
  - type: reading
    title: Summary
    path: sections/section-020/module-01/course-04-summary.md
  - type: reading
    title: Question
    path: sections/section-020/capstone/labs/lab-01/question.md
