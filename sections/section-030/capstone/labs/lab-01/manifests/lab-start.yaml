# The Starfleet example app: scout and probe (backends) and shuttle (client)
# in `starfleet`, drifter (outside client) in `outpost`. Each workload has its
# own service account.
apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scout
  namespace: starfleet
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: probe
  namespace: starfleet
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shuttle
  namespace: starfleet
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: drifter
  namespace: outpost
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scout
  namespace: starfleet
  labels:
    app: scout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scout
  template:
    metadata:
      labels:
        app: scout
    spec:
      serviceAccountName: scout
      containers:
        - name: scout
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - name: http
              containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: scout
  namespace: starfleet
spec:
  selector:
    app: scout
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: starfleet
  labels:
    app: probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      serviceAccountName: probe
      containers:
        - name: probe
          image: mccutchen/go-httpbin:2.25.0
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: probe
  namespace: starfleet
spec:
  selector:
    app: probe
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shuttle
  namespace: starfleet
  labels:
    app: shuttle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shuttle
  template:
    metadata:
      labels:
        app: shuttle
    spec:
      serviceAccountName: shuttle
      containers:
        - name: shuttle
          image: curlimages/curl:8.22.0
          command: ["sh", "-c", "while true; do sleep 30; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drifter
  namespace: outpost
  labels:
    app: drifter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: drifter
  template:
    metadata:
      labels:
        app: drifter
    spec:
      serviceAccountName: drifter
      containers:
        - name: drifter
          image: curlimages/curl:8.22.0
          command: ["sh", "-c", "while true; do sleep 30; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
---
# patrol-binder: a CronJob that, every two minutes, creates the RoleBinding
# patrol-view in starfleet for the ServiceAccount drifter in outpost and
# deletes it again. The RBAC change is the activity the auditors must find.
apiVersion: v1
kind: Secret
metadata:
  name: scout-db-credentials
  namespace: starfleet
type: Opaque
stringData:
  username: scout
  password: change-me-in-production
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: patrol-binder
  namespace: outpost
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: patrol-view
  namespace: starfleet
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: patrol-binder
  namespace: starfleet
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: patrol-binder
  namespace: starfleet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: patrol-binder
subjects:
  - kind: ServiceAccount
    name: patrol-binder
    namespace: outpost
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: patrol-script
  namespace: outpost
data:
  patrol.sh: |
    #!/bin/sh
    API_URL=https://kubernetes.default.svc
    SA_DIR=/var/run/secrets/kubernetes.io/serviceaccount
    TOKEN=$(cat "$SA_DIR/token")
    call_api() {
      curl -sS -o /dev/null -w "%{http_code}\n" --cacert "$SA_DIR/ca.crt" -H "Authorization: Bearer $TOKEN" "$@"
    }
    BODY='{"apiVersion":"rbac.authorization.k8s.io/v1","kind":"RoleBinding","metadata":{"name":"patrol-view","namespace":"starfleet"},"roleRef":{"apiGroup":"rbac.authorization.k8s.io","kind":"Role","name":"patrol-view"},"subjects":[{"kind":"ServiceAccount","name":"drifter","namespace":"outpost"}]}'
    echo "create rolebinding: $(call_api -X POST -H 'Content-Type: application/json' --data "$BODY" "$API_URL/apis/rbac.authorization.k8s.io/v1/namespaces/starfleet/rolebindings")"
    sleep 5
    echo "delete rolebinding: $(call_api -X DELETE "$API_URL/apis/rbac.authorization.k8s.io/v1/namespaces/starfleet/rolebindings/patrol-view")"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: patrol-binder
  namespace: outpost
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: patrol-binder
          restartPolicy: Never
          containers:
            - name: patrol-binder
              image: curlimages/curl:8.22.0
              command: ["sh", "/job/patrol.sh"]
              volumeMounts:
                - name: job
                  mountPath: /job
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 32Mi
          volumes:
            - name: job
              configMap:
                name: patrol-script
