# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Cluster PKI And Client Certificates (PLAYGROUND). A clean sandbox: no task, no grading, no `astrona submit`.
apiVersion: astrona.io/v1
metadata:
  name: ats-045-playground-050-01
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0

bootstrap:
  manifests:
    - name: starfleet
      type: file
      source: manifests/starfleet.yaml
  waitFor:
    - resource: deploy/scout
      namespace: starfleet

teardown:
  keepCluster: false
