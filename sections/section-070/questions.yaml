status: draft
provenance: Original practice material; not official examination questions.
scope:
  type: section
  id: section-070
  title: 'Checkpoint: Admission Control'
placement:
  position: after
  reading: sections/section-070/module-01/course-02-summary.md
questions:
- id: ats045-section-070-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Distinguish private reachability from authenticated authority.
  source_readings:
  - sections/section-060/module-01/course-01-designing-allowed-paths-without-implicit-trust.md
  prompt: A caller reaches an internal management endpoint. What should still be required?
  options:
  - id: a
    text: Automatic unrestricted administration.
    explanation: Internal location is not a universal grant.
  - id: b
    text: Only matching object names.
    explanation: Names do not authenticate the caller.
  - id: c
    text: Trusted identity and permission for the requested operation.
    explanation: Private reachability does not establish authority.
  correct_option: c
  explanation: Private reachability does not establish authority.
- id: ats045-section-070-q02
  type: single_choice
  difficulty: beginner
  learning_objective: Relate segmentation and encryption to different protections.
  source_readings:
  - sections/section-060/module-01/course-01-designing-allowed-paths-without-implicit-trust.md
  prompt: TLS protects the external entry hop but not a later internal hop. Which claim is accurate?
  options:
  - id: a
    text: No hop can ever use encryption.
    explanation: Separate protected hops can be configured.
  - id: b
    text: Protection must be evaluated for each defined connection boundary.
    explanation: One secure entry does not automatically cover later plaintext paths.
  - id: c
    text: All internal bytes are necessarily encrypted.
    explanation: That does not follow from the stated configuration.
  correct_option: b
  explanation: One secure entry does not automatically cover later plaintext paths.
- id: ats045-section-070-q03
  type: single_choice
  difficulty: beginner
  learning_objective: Distinguish mutation, validation and authorization.
  source_readings:
  - sections/section-070/module-01/course-01-admission-as-a-controlled-resource-decision.md
  prompt: A webhook adds defaults, then another policy checks the final declaration. Which roles are represented?
  options:
  - id: a
    text: Mutation followed by validation.
    explanation: Changing supported fields and accepting or rejecting them are distinct functions.
  - id: b
    text: Authentication followed by image building.
    explanation: Those are different stages and responsibilities.
  - id: c
    text: Scheduling followed by datastore backup.
    explanation: Neither describes the stated admission behavior.
  correct_option: a
  explanation: Changing supported fields and accepting or rejecting them are distinct functions.
- id: ats045-section-070-q04
  type: single_choice
  difficulty: beginner
  learning_objective: Explain built-in, declarative and webhook admission mechanisms.
  source_readings:
  - sections/section-070/module-01/course-01-admission-as-a-controlled-resource-decision.md
  prompt: A webhook excludes some namespaces from matching. What should be assessed?
  options:
  - id: a
    text: Assume every request is still evaluated identically.
    explanation: Matching scope determines which requests reach the rule.
  - id: b
    text: Only whether the service has a short name.
    explanation: Naming does not prove coverage.
  - id: c
    text: Whether the effective coverage and exceptions fit the intended control.
    explanation: Registration alone does not establish universal request coverage.
  correct_option: c
  explanation: Registration alone does not establish universal request coverage.
- id: ats045-section-070-q05
  type: single_choice
  difficulty: beginner
  learning_objective: Identify extension credentials, transport and availability requirements.
  source_readings:
  - sections/section-070/module-01/course-01-admission-as-a-controlled-resource-decision.md
  prompt: An external validation service is required by admission. What operating properties matter?
  options:
  - id: a
    text: A guarantee that all external services are always available.
    explanation: Availability needs design and observation rather than assumption.
  - id: b
    text: Reachability, trusted transport, decision correctness and failure behavior.
    explanation: The extension joins the API acceptance trust and availability path.
  - id: c
    text: Only application cache size.
    explanation: That does not establish the webhook's contract.
  correct_option: b
  explanation: The extension joins the API acceptance trust and availability path.
