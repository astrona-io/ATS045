apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scout
  namespace: starfleet
imagePullSecrets:
  - name: registry-pull
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shuttle
  namespace: starfleet
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: drifter
  namespace: outpost
imagePullSecrets:
  - name: registry-pull
---
apiVersion: v1
kind: Secret
metadata:
  name: registry-pull
  namespace: starfleet
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths": {"localhost:30500": {"username": "puller", "password": "pull-pass-7", "auth": "cHVsbGVyOnB1bGwtcGFzcy03"}}}'
---
apiVersion: v1
kind: Secret
metadata:
  name: registry-pull
  namespace: outpost
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths": {"localhost:30500": {"username": "puller", "password": "pull-pass-7", "auth": "cHVsbGVyOnB1bGwtcGFzcy03"}}}'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scout
  namespace: starfleet
  labels:
    app: scout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scout
  template:
    metadata:
      labels:
        app: scout
    spec:
      serviceAccountName: scout
      containers:
        - name: scout
          image: localhost:30500/starfleet/podinfo:6.15.0
          ports:
            - name: http
              containerPort: 9898
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drifter
  namespace: outpost
  labels:
    app: drifter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: drifter
  template:
    metadata:
      labels:
        app: drifter
    spec:
      serviceAccountName: drifter
      containers:
        - name: drifter
          image: localhost:30500/starfleet/podinfo:6.15.0
          ports:
            - name: http
              containerPort: 9898
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shuttle
  namespace: starfleet
  labels:
    app: shuttle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shuttle
  template:
    metadata:
      labels:
        app: shuttle
    spec:
      serviceAccountName: shuttle
      containers:
        - name: shuttle
          image: curlimages/curl:8.22.0
          command: ["sh", "-c", "while true; do sleep 30; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
