apiVersion: v1
kind: Namespace
metadata:
  name: registry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: registry
  labels:
    app: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      initContainers:
        - name: make-htpasswd
          image: httpd:2.4-alpine
          command: ["sh", "-c", "htpasswd -Bbn publisher push-pass-3 > /auth/htpasswd && htpasswd -Bbn puller pull-pass-7 >> /auth/htpasswd"]
          volumeMounts:
            - name: auth
              mountPath: /auth
      containers:
        - name: registry
          image: registry:2.8.3
          env:
            - name: REGISTRY_AUTH
              value: htpasswd
            - name: REGISTRY_AUTH_HTPASSWD_REALM
              value: Private registry
            - name: REGISTRY_AUTH_HTPASSWD_PATH
              value: /auth/htpasswd
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          ports:
            - name: registry
              containerPort: 5000
          readinessProbe:
            tcpSocket:
              port: registry
          volumeMounts:
            - name: auth
              mountPath: /auth
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
      volumes:
        - name: auth
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: registry
spec:
  type: NodePort
  selector:
    app: registry
  ports:
    - name: registry
      port: 5000
      targetPort: registry
      nodePort: 30500
---
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-images
  namespace: registry
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: skopeo
          image: quay.io/skopeo/stable:v1.18.0
          command:
            - skopeo
            - copy
            - --dest-tls-verify=false
            - --dest-creds=publisher:push-pass-3
            - docker://ghcr.io/stefanprodan/podinfo:6.15.0
            - docker://registry.registry.svc.cluster.local:5000/starfleet/podinfo:6.15.0
