provenance: Original practice material; not official examination questions.
scope:
  type: domain
  id: domain-review
  title: Platform Security
placement:
  position: after
  reading: sections/section-070/module-01/course-02-summary.md
questions:
- id: ats045-domain-review-q01
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain continued maintenance after an artifact is approved.
  source_readings:
  - sections/section-010/module-01/course-02-connecting-verification-to-execution-policy.md
  prompt: An image passed a scan last month, but a relevant vulnerability is disclosed today. What is
    needed?
  options:
  - id: a
    text: Assume the old result permanently approves it.
    explanation: The risk context has changed.
  - id: b
    text: Only switching to a different tag name for the same bytes.
    explanation: Renaming does not remediate content.
  - id: c
    text: Reassessment of affected deployed content and a maintenance response.
    explanation: Historical evidence does not freeze future vulnerability knowledge.
  correct_option: c
  explanation: Historical evidence does not freeze future vulnerability knowledge.
- id: ats045-domain-review-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: Identify sensitive build layers and retained artifact copies.
  source_readings:
  - sections/section-020/module-01/course-02-protecting-publishers-readers-and-repository-state.md
  prompt: Registry cleanup removes a release artifact while running nodes retain cached copies. What risk
    can appear later?
  options:
  - id: a
    text: The cleanup automatically restores previous report data.
    explanation: Repository retention is a different lifecycle from application storage.
  - id: b
    text: Replacement or rollout may fail to retrieve the required image.
    explanation: Current execution does not prove future artifact availability.
  - id: c
    text: Every current Pod is instantly deleted by the registry.
    explanation: Cleanup does not necessarily terminate existing containers.
  correct_option: b
  explanation: Current execution does not prove future artifact availability.
- id: ats045-domain-review-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: Identify sensitive fields and evidence gaps.
  source_readings:
  - sections/section-030/module-01/course-02-security-signals-across-different-boundaries.md
  prompt: An investigation has no record because collection failed. What is the correct interpretation?
  options:
  - id: a
    text: Evidence coverage is incomplete; absence is not proof of no event.
    explanation: Observation-path failure limits conclusions.
  - id: b
    text: The event definitely never occurred.
    explanation: Missing data cannot support that certainty.
  - id: c
    text: The user identity in any unrelated log proves the action.
    explanation: Attribution needs relevant correlated evidence.
  correct_option: a
  explanation: Observation-path failure limits conclusions.
- id: ats045-domain-review-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: Describe rotation and compromise recovery for certificate-based identities.
  source_readings:
  - sections/section-050/module-01/course-01-pki-trust-and-certificate-verification.md
  prompt: New certificate files exist, but a process still uses its old identity. What needs verification?
  options:
  - id: a
    text: Only whether the file has a familiar extension.
    explanation: The name does not prove it is being used.
  - id: b
    text: Assume new files automatically revoke all old credentials everywhere.
    explanation: Actual validation and revocation mechanisms determine that effect.
  - id: c
    text: Consumer reload or restart behavior and the effective credential.
    explanation: File replacement and process adoption are separate stages.
  correct_option: c
  explanation: File replacement and process adoption are separate stages.
- id: ats045-domain-review-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: Relate failure policy and exemptions to effective enforcement.
  source_readings:
  - sections/section-070/module-01/course-01-admission-as-a-controlled-resource-decision.md
  prompt: An identity can broaden the admission exception that applies to its workload. What should be
    protected?
  options:
  - id: a
    text: All workloads must receive the same broad exemption.
    explanation: That expands rather than narrows the bypass.
  - id: b
    text: Authority over the exception and policy configuration.
    explanation: A control can be undermined through its own management boundary.
  - id: c
    text: Only the image's display tag.
    explanation: That does not constrain exception changes.
  correct_option: b
  explanation: A control can be undermined through its own management boundary.
